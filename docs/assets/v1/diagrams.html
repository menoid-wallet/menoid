<!--
  The diagrams in V1-DOCS.md, drawn as SVG in the style of the V0.5 ones
  (yellow #F0CF60 boxes and diamonds, black arrows, red Reject pills).
  Open this file in a browser to see them; each <figure> is one PNG in this
  folder, exported at 2x.
-->
<style>
  body { margin: 0; background: #fff; }
  figure { margin: 0 0 40px; display: block; width: max-content; }
  svg { display: block; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif; }
</style>
</head>

<script>
const Y = "#F0CF60", RED = "#DB6554";
const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

// text block centred on (x, y); `rotate` turns it about that point
function T(x, y, lines, o = {}) {
  const { size = 11.5, weight = 700, lh = size * 1.32, anchor = "middle", fill = "#000", rotate = 0 } = o;
  lines = [].concat(lines);
  const first = -((lines.length - 1) * lh) / 2 + size * 0.36;
  const spans = lines.map((l, i) => `<tspan x="0" y="${(first + i * lh).toFixed(2)}">${esc(l) || " "}</tspan>`).join("");
  return `<g transform="translate(${x},${y})${rotate ? ` rotate(${rotate})` : ""}"><text text-anchor="${anchor}" font-size="${size}" font-weight="${weight}" fill="${fill}">${spans}</text></g>`;
}
// a label (regular weight)
const L = (x, y, lines, o = {}) => T(x, y, lines, { weight: 400, size: 10.8, ...o });
function box(x, y, w, h, lines, o = {}) {
  const r = o.r ?? 12;
  return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}" fill="${o.fill || Y}"/>` + (lines ? T(x + w / 2, y + h / 2, lines, o) : "");
}
const pill = (x, y, w, h, lines, o = {}) => box(x, y, w, h, lines, { ...o, r: h / 2 });
function dia(cx, cy, w, h, lines, o = {}) {
  return `<polygon points="${cx},${cy - h / 2} ${cx + w / 2},${cy} ${cx},${cy + h / 2} ${cx - w / 2},${cy}" fill="${Y}"/>` + T(cx, cy, lines, o);
}
const reject = (cx, cy, text = "Reject", w = 92, h = 22) => pill(cx - w / 2, cy - h / 2, w, h, null, { fill: RED }) + T(cx, cy, [text], { size: 9.5, fill: "#fff" });
function path(d, o = {}) {
  const head = o.head ?? "end";
  return `<path d="${d}" fill="none" stroke="#000" stroke-width="1.5"${o.dash ? ` stroke-dasharray="${o.dash}"` : ""}${head === "end" || head === "both" ? ' marker-end="url(#ah)"' : ""}${head === "both" ? ' marker-start="url(#ah)"' : ""}/>`;
}
const arrow = (pts, o) => path("M" + pts.map((p) => p.join(",")).join(" L"), o);
// a cubic curve; its label follows the curve at `t`, `off` px to the text's top (negative: below);
// `flat` keeps the label horizontal, starting `off` px to the right of the curve
function curve(p0, p1, p2, p3, o = {}) {
  let out = path(`M${p0} C${p1} ${p2} ${p3}`, o);
  if (!o.label) return out;
  const t = o.t ?? 0.5, mt = 1 - t;
  const at = (i) => mt ** 3 * p0[i] + 3 * mt * mt * t * p1[i] + 3 * mt * t * t * p2[i] + t ** 3 * p3[i];
  const dt = (i) => 3 * mt * mt * (p1[i] - p0[i]) + 6 * mt * t * (p2[i] - p1[i]) + 3 * t * t * (p3[i] - p2[i]);
  const x = at(0), y = at(1);
  if (o.flat) return out + L(x + (o.off ?? 12), y, o.label, { anchor: "start", size: o.size ?? 10.6 });
  let ang = (Math.atan2(dt(1), dt(0)) * 180) / Math.PI;
  if (ang > 90) ang -= 180;
  if (ang < -90) ang += 180;
  const r = (ang * Math.PI) / 180, off = o.off ?? 9;
  return out + L(x + Math.sin(r) * off, y - Math.cos(r) * off, o.label, { rotate: ang, size: o.size ?? 10.6 });
}
// a speech bubble pointing down (the "Register" call-out)
const bubble = (x, y, w, h, tipX, tipY, lines) =>
  box(x, y, w, h, lines) + `<polygon points="${tipX - 22},${y + h - 1} ${tipX + 22},${y + h - 1} ${tipX},${tipY}" fill="${Y}"/>`;

function figure(id, w, h, body) {
  const f = document.createElement("figure");
  f.id = id;
  f.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">
    <defs><marker id="ah-${id}" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker></defs>
    <rect width="${w}" height="${h}" fill="#fff"/>${body.replaceAll("url(#ah)", `url(#ah-${id})`)}</svg>`;
  document.body.appendChild(f);
}
